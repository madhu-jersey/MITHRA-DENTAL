<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rating overview | Sree Mithra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap">
<style>body { margin: 0; background: #FDEEF1; }</style>
</head>
<body>

<!-- ================================================================
     RATING OVERVIEW BLOCK: copy from here to "END RATING OVERVIEW".
     Edit the numbers in SMR_DATA (top of the <script>) only.
     ================================================================ -->
<section class="smr" aria-labelledby="smr-title">
  <div class="smr__inner">
    <p class="smr__eyebrow">Google Reviews</p>
    <h2 class="smr__title" id="smr-title">What our <span>patients say</span></h2>

    <div class="smr__card" data-smr-card>
      <div class="smr__summary">
        <p class="sr-only" data-smr-announce></p>
        <p class="smr__score" aria-hidden="true"><span data-smr-average></span></p>
        <div class="smr__stars" aria-hidden="true" data-smr-stars></div>
        <p class="smr__total" aria-hidden="true"><span data-smr-total></span> Google reviews</p>
        <a class="smr__write" data-smr-write target="_blank" rel="noopener">
          Write a review
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14 4h6v6M20 4l-9 9M18 14v4.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10"/></svg>
          <span class="sr-only"> (opens Google in a new tab)</span>
        </a>
        <p class="smr__updated" data-smr-updated></p>
      </div>
      <div class="smr__divider" aria-hidden="true"></div>
      <ul class="smr__rows" aria-label="Rating breakdown" data-smr-rows></ul>
    </div>
  </div>
</section>

<style>
  .smr {
    --smr-maroon-900: #2B0A12;
    --smr-crimson: #9E0B24;
    --smr-red: #C41E3A;
    --smr-maroon: #7A2535;
    --smr-blush: #FDEEF1;
    --smr-pink: #F3D3DB;
    --smr-white: #FFFFFF;
    --smr-grey: #5B5B5B;
    --smr-gold: #E0A000;
    --smr-ease: cubic-bezier(0.22, 1, 0.36, 1);
    background: var(--smr-blush);
    padding: clamp(56px, 8vw, 104px) 16px;
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--smr-grey);
    -webkit-font-smoothing: antialiased;
  }
  .smr *, .smr *::before, .smr *::after { box-sizing: border-box; }
  .smr p, .smr h2, .smr ul { margin: 0; padding: 0; }
  .smr ul { list-style: none; }
  .smr .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .smr__inner { max-width: 1160px; margin: 0 auto; }

  .smr__eyebrow {
    display: flex; align-items: center; gap: 12px;
    font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--smr-red);
  }
  .smr__eyebrow::before { content: ""; width: 24px; height: 2px; border-radius: 2px; background: var(--smr-red); }
  .smr__title {
    margin-top: 18px !important; font-family: "Plus Jakarta Sans", system-ui, sans-serif; font-weight: 800;
    font-size: clamp(32px, 4.4vw, 48px); line-height: 1.1; letter-spacing: -0.025em; color: var(--smr-maroon-900);
  }
  .smr__title span { color: var(--smr-red); }

  /* Card */
  .smr__card {
    position: relative; margin-top: clamp(32px, 5vw, 48px);
    display: grid; grid-template-columns: minmax(220px, .8fr) 1px 1.4fr; gap: clamp(24px, 4vw, 56px); align-items: center;
    background: var(--smr-white); border: 1px solid var(--smr-pink); border-radius: 20px;
    padding: clamp(24px, 4vw, 44px);
    box-shadow: 0 6px 18px -10px rgba(158, 11, 36, .14);
  }
  /* Deeper shadow on its own layer so only its opacity animates */
  .smr__card::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 0;
    box-shadow: 0 24px 56px -22px rgba(158, 11, 36, .26);
  }
  .smr__card > * { position: relative; z-index: 1; }

  /* Summary */
  .smr__summary { display: grid; justify-items: start; gap: 10px; }
  .smr__score {
    font-family: "Plus Jakarta Sans", system-ui, sans-serif; font-weight: 800; font-size: clamp(56px, 7vw, 76px);
    line-height: 1; letter-spacing: -0.03em; color: var(--smr-maroon-900); font-variant-numeric: tabular-nums;
  }
  .smr__score span { display: inline-block; transform-origin: left bottom; }
  .smr__stars { display: flex; gap: 4px; color: var(--smr-gold); }
  .smr__stars svg { width: 24px; height: 24px; fill: currentColor; }
  .smr__total { font-weight: 600; color: var(--smr-maroon-900); font-size: 17px; font-variant-numeric: tabular-nums; }
  .smr__write {
    display: inline-flex; align-items: center; gap: 10px; min-height: 44px; margin-top: 6px; padding: 8px 18px;
    border: 2px solid var(--smr-red); border-radius: 999px; background: var(--smr-white);
    color: var(--smr-red); font-weight: 600; font-size: 15px; text-decoration: none;
    transition: background-color .25s var(--smr-ease), color .25s var(--smr-ease), transform .35s var(--smr-ease);
  }
  .smr__write svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .smr__write:hover { background: var(--smr-red); color: var(--smr-white); transform: translateY(-2px); }
  .smr__updated { font-size: 13.5px; color: var(--smr-grey); }

  .smr__divider { align-self: stretch; width: 1px; background: var(--smr-pink); transform-origin: top; }

  /* Rows */
  .smr__rows { display: grid; gap: 4px; }
  .smr__row {
    display: grid; grid-template-columns: 36px 1fr 40px; align-items: center; gap: 14px;
    min-height: 44px; padding: 0 10px; margin: 0 -10px; border-radius: 12px;
    color: inherit; text-decoration: none; background: transparent;
    outline: none; transition: background-color .2s var(--smr-ease);
  }
  /* No outline/border by default; hover and keyboard focus get a soft pink tint */
  .smr__row:hover, .smr__row:focus-visible { background: var(--smr-blush); }
  /* Focus ring for keyboard users only */
  .smr__row:focus-visible { outline: 2px solid var(--smr-red); outline-offset: 2px; }
  .smr__label { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; color: var(--smr-maroon-900); font-variant-numeric: tabular-nums; }
  .smr__label svg { width: 14px; height: 14px; fill: var(--smr-gold); }
  .smr__track { position: relative; height: 10px; border-radius: 999px; background: var(--smr-pink); overflow: hidden; }
  .smr__fill {
    position: absolute; inset: 0; border-radius: 999px; background: rgba(196, 30, 58, .45);
    transform-origin: left; transform: scaleX(var(--w, 0));
  }
  .smr__row[data-star="5"] .smr__fill { background: var(--smr-crimson); }
  .smr__row[data-star="4"] .smr__fill { background: var(--smr-maroon); }
  .smr__fill::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--smr-white); opacity: 0; transition: opacity .25s var(--smr-ease); }
  .smr__row:hover .smr__fill::after, .smr__row:focus-visible .smr__fill::after { opacity: .2; }
  /* Glow: a full-track layer whose right edge follows the fill's front edge */
  .smr__glow { position: absolute; inset: 0; opacity: 0; pointer-events: none; transform: translateX(calc((var(--w, 0) - 1) * 100%)); }
  .smr__glow::after { content: ""; position: absolute; top: -6px; bottom: -6px; right: -12px; width: 28px; background: radial-gradient(closest-side, rgba(255, 255, 255, .95), rgba(255, 255, 255, 0)); }
  .smr__count {
    justify-self: end; font-weight: 600; color: var(--smr-maroon-900); font-variant-numeric: tabular-nums;
    display: inline-block; transition: transform .3s var(--smr-ease);
  }
  .smr__row:hover .smr__count, .smr__row:focus-visible .smr__count { transform: scale(1.05); }

  /* ---------------- Animation (only when JS has armed it) ---------------- */
  .smr__card.is-armed { opacity: 0; transform: translateY(16px); transition: opacity .6s var(--smr-ease), transform .6s var(--smr-ease); }
  .smr__card.is-armed::before { opacity: 0; transition: opacity .6s var(--smr-ease); }
  .smr__card.is-armed .smr__stars svg { opacity: .2; transform: scale(.6); transition: opacity .4s var(--smr-ease), transform .5s var(--smr-ease); }
  .smr__card.is-armed .smr__divider { transform: scaleY(0); transition: transform .9s var(--smr-ease) .25s; }
  .smr__card.is-armed .smr__label { opacity: 0; transform: translateX(-8px); transition: opacity .25s var(--smr-ease), transform .25s var(--smr-ease); }
  .smr__card.is-armed .smr__fill { transform: scaleX(0); transition: transform .8s var(--smr-ease); }
  .smr__card.is-armed .smr__count { opacity: 0; transition: opacity .25s var(--smr-ease), transform .3s var(--smr-ease); }
  .smr__card.is-armed .smr__write { opacity: 0; transition: opacity .3s var(--smr-ease) 1.25s, background-color .25s var(--smr-ease), color .25s var(--smr-ease), transform .35s var(--smr-ease); }

  .smr__card.is-armed.is-in { opacity: 1; transform: none; }
  .smr__card.is-armed.is-in::before { opacity: 1; }
  .smr__card.is-armed.is-in .smr__stars svg { opacity: 1; transform: none; transition-delay: calc(150ms + var(--s) * 80ms); }
  .smr__card.is-armed.is-in .smr__divider { transform: none; }
  .smr__card.is-armed.is-in .smr__label,
  .smr__card.is-armed.is-in .smr__fill,
  .smr__card.is-armed.is-in .smr__count { transition-delay: calc(300ms + var(--i) * 120ms); }
  .smr__card.is-armed.is-in .smr__label { opacity: 1; transform: none; }
  .smr__card.is-armed.is-in .smr__fill { transform: scaleX(var(--w, 0)); }
  .smr__card.is-armed.is-in .smr__count { opacity: 1; }
  .smr__card.is-armed.is-in .smr__write { opacity: 1; }
  .smr__card.is-armed.is-in .smr__glow { animation: smrGlow .8s var(--smr-ease) both; animation-delay: calc(300ms + var(--i) * 120ms); }
  /* After the sequence, hover responds without the stagger delays */
  .smr__card.is-done .smr__label, .smr__card.is-done .smr__fill, .smr__card.is-done .smr__count { transition-delay: 0ms !important; }
  .smr__card.is-done .smr__write { transition-delay: 0ms, 0ms, 0ms, 0ms; }
  .smr__card.is-armed.is-in .smr__row:hover .smr__count,
  .smr__card.is-armed.is-in .smr__row:focus-visible .smr__count { transform: scale(1.05); }
  @keyframes smrGlow {
    0% { opacity: 0; transform: translateX(-100%); }
    8% { opacity: 1; }
    42% { opacity: .9; }
    50% { opacity: 0; }
    100% { opacity: 0; transform: translateX(calc((var(--w, 0) - 1) * 100%)); }
  }
  .smr__score span.is-pulse { animation: smrPulse .35s var(--smr-ease); }
  @keyframes smrPulse { 40% { transform: scale(1.06); } 100% { transform: none; } }

  @media (max-width: 760px) {
    .smr__card { grid-template-columns: 1fr; }
    .smr__divider { width: auto; height: 1px; transform-origin: left; }
    .smr__card.is-armed .smr__divider { transform: scaleX(0); }
    .smr__card.is-armed.is-in .smr__divider { transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .smr *, .smr *::before, .smr *::after, .smr__card, .smr__card::before { transition: none !important; animation: none !important; }
    .smr__glow { display: none; }
  }
</style>

<script>
(function () {
  "use strict";

  /* ---------------- DATA: change the numbers here only ---------------- */
  var SMR_DATA = {
    average: 4.9,
    total: 52,
    // ESTIMATED: replace with the exact counts from the Google listing
    counts: { 5: 45, 4: 7, 3: 0, 2: 0, 1: 0 },
    updated: "17 Oct 2026",
    reviewsUrl: "https://www.google.com/maps/place/SREE+MITHRA+DENTAL+SPECIALISTS/@16.7517297,81.6838545,17z/data=!4m8!3m7!1s0x3a37b7fa0d0de735:0x3787843e081afac6!8m2!3d16.7517246!4d81.6864294!9m1!1b1!16s%2Fg%2F11c6dcl9dq"
  };
  /* -------------------------------------------------------------------- */

  var card = document.querySelector("[data-smr-card]");
  if (!card) return;
  var q = function (s) { return card.querySelector(s); };
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var STAR = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3.3l2.6 5.5 6 .7-4.5 4.1 1.2 6-5.3-3-5.3 3 1.2-6L3.4 9.5l6-.7z"/></svg>';
  var d = SMR_DATA;
  var stars = [5, 4, 3, 2, 1];
  var max = Math.max.apply(null, stars.map(function (n) { return d.counts[n] || 0; })) || 1;

  /* Render (final values first, so the block is correct even without animation) */
  q("[data-smr-announce]").textContent = "Rated " + d.average.toFixed(1) + " out of 5 from " + d.total + " Google reviews";
  var avgEl = q("[data-smr-average]"), totalEl = q("[data-smr-total]");
  avgEl.textContent = d.average.toFixed(1);
  totalEl.textContent = String(d.total);
  q("[data-smr-stars]").innerHTML = [0, 1, 2, 3, 4].map(function (i) { return STAR.replace("<svg ", '<svg style="--s:' + i + '" '); }).join("");
  var write = q("[data-smr-write]");
  write.href = d.reviewsUrl;
  q("[data-smr-updated]").textContent = "Based on Google reviews. Updated " + d.updated + ".";

  q("[data-smr-rows]").innerHTML = stars.map(function (n, i) {
    var c = d.counts[n] || 0, w = (c / max).toFixed(4);
    var label = n + " star" + (n > 1 ? "s" : "") + ": " + c + " review" + (c === 1 ? "" : "s") + ", opens Google reviews in a new tab";
    return '<li><a class="smr__row" data-star="' + n + '" style="--i:' + i + '" href="' + d.reviewsUrl + '" target="_blank" rel="noopener" aria-label="' + label + '">' +
      '<span class="smr__label" aria-hidden="true">' + n + STAR + "</span>" +
      '<span class="smr__track" aria-hidden="true"><span class="smr__fill" style="--w:' + w + '"></span>' +
      (c > 0 ? '<span class="smr__glow" style="--w:' + w + '"></span>' : "") + "</span>" +
      '<span class="smr__count" aria-hidden="true" data-n="' + c + '">' + c + "</span></a></li>";
  }).join("");

  if (reduce || !("IntersectionObserver" in window)) return; // final values, no motion

  /* Arm the entrance and play it once when the card enters view */
  var countUp = function (dur, delay, draw, done) {
    setTimeout(function () {
      var t0 = performance.now();
      (function tick(t) {
        var p = Math.min(1, Math.max(0, (t - t0) / dur));
        draw(1 - Math.pow(1 - p, 3));
        if (p < 1) requestAnimationFrame(tick); else if (done) done();
      })(t0);
    }, delay);
  };
  var rowCounts = Array.prototype.slice.call(card.querySelectorAll(".smr__count"));
  card.classList.add("is-armed");
  void card.offsetWidth; // commit the hidden start state before the entrance can begin
  avgEl.textContent = "0.0";
  totalEl.textContent = "0";
  rowCounts.forEach(function (el) { el.textContent = "0"; });

  var io = new IntersectionObserver(function (entries) {
    if (!entries[0].isIntersecting) return;
    io.disconnect();
    card.classList.add("is-in");
    countUp(900, 0, function (k) { avgEl.textContent = (d.average * k).toFixed(1); }, function () {
      avgEl.textContent = d.average.toFixed(1);
      avgEl.classList.add("is-pulse");
    });
    countUp(700, 0, function (k) { totalEl.textContent = String(Math.round(d.total * k)); });
    rowCounts.forEach(function (el, i) {
      var n = parseInt(el.getAttribute("data-n"), 10);
      countUp(800, 300 + i * 120, function (k) { el.textContent = String(Math.round(n * k)); });
    });
    setTimeout(function () { card.classList.add("is-done"); }, 1700);
  }, { threshold: 0.2 });
  io.observe(card);
})();
</script>
<!-- ================== END RATING OVERVIEW ================== -->

</body>
</html>
